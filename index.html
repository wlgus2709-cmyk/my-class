<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>초등 4학년 온라인 예절 & 지역 소개 채팅 - 제민이와 함께해요!</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts (Jua & Noto Sans KR) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background: linear-gradient(135deg, #e0f2fe 0%, #f0f9ff 50%, #fef3c7 100%);
    }
    .font-jua {
      font-family: 'Jua', sans-serif;
    }
    /* Custom Scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f5f9;
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb {
      background: #93c5fd;
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #60a5fa;
    }
    /* Bounce Animation */
    @keyframes gentle-bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }
    .animate-bounce-gentle {
      animation: gentle-bounce 2s infinite ease-in-out;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col text-slate-800 antialiased selection:bg-sky-200">

  <!-- Header Banner -->
  <header class="bg-gradient-to-r from-sky-500 via-teal-400 to-amber-300 text-white shadow-md">
    <div class="max-w-3xl mx-auto px-4 py-3 flex items-center justify-between gap-2">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 bg-white rounded-full flex items-center justify-center text-sky-600 shadow-md text-xl animate-bounce-gentle">
          🌊
        </div>
        <div>
          <h1 class="font-jua text-lg md:text-xl tracking-wide flex items-center gap-2">
            부산 친구 제민이와의 대화 👦🏻
          </h1>
          <p class="text-[11px] text-sky-100 font-medium">온라인 예절을 지키며 지역 소개 대화하기</p>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="flex items-center space-x-2">
        <button onclick="evaluateEtiquetteScore()" class="bg-amber-400 hover:bg-amber-500 text-slate-900 font-jua text-xs px-2.5 py-1.5 rounded-xl shadow transition flex items-center gap-1 active:scale-95 cursor-pointer">
          <i class="fa-solid fa-star text-amber-800"></i> <span>점수 확인</span>
        </button>
        <button onclick="downloadChatHistory()" class="bg-white/90 hover:bg-white text-sky-700 font-bold text-xs px-2.5 py-1.5 rounded-xl shadow transition flex items-center gap-1 active:scale-95" title="대화 기록 저장">
          <i class="fa-solid fa-download text-sky-500"></i> <span class="hidden sm:inline">저장</span>
        </button>
        <button onclick="confirmReset()" class="bg-rose-500 hover:bg-rose-600 text-white font-bold text-xs px-2.5 py-1.5 rounded-xl shadow transition flex items-center gap-1 active:scale-95">
          <i class="fa-solid fa-rotate-right"></i> <span class="hidden sm:inline">다시 시작</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Container: Pure Chat Only -->
  <main class="flex-1 max-w-3xl w-full mx-auto p-2 sm:p-4 flex flex-col overflow-hidden">
    <!-- Main Chat Card -->
    <section class="flex-1 bg-white/95 backdrop-blur rounded-2xl shadow-xl border border-sky-100 flex flex-col h-[calc(100vh-6rem)] md:h-[82vh] overflow-hidden">
      
      <!-- Chat Header Subtitle -->
      <div class="px-4 py-2 bg-sky-50/80 border-b border-sky-100 flex items-center justify-between text-xs text-slate-600">
        <div class="flex items-center space-x-2">
          <span class="inline-block w-2.5 h-2.5 bg-emerald-500 rounded-full animate-pulse"></span>
          <span class="font-medium">부산 4학년 제민이와 1:1 대화 중</span>
        </div>
        <span class="text-[11px] text-slate-400">대화 주제: 우리 고장 소개하기 🏙️</span>
      </div>

      <!-- Message History Container -->
      <div id="chat-messages" class="flex-1 p-4 overflow-y-auto space-y-4 bg-slate-50/50">
        <!-- Messages dynamically rendered here -->
      </div>

      <!-- Typing Indicator -->
      <div id="typing-indicator" class="hidden px-4 py-2 text-xs text-slate-500 flex items-center space-x-2 italic">
        <div class="flex space-x-1">
          <div class="w-2 h-2 bg-sky-400 rounded-full animate-bounce"></div>
          <div class="w-2 h-2 bg-sky-400 rounded-full animate-bounce [animation-delay:0.2s]"></div>
          <div class="w-2 h-2 bg-sky-400 rounded-full animate-bounce [animation-delay:0.4s]"></div>
        </div>
        <span>제민이가 생각하며 답장을 적는 중... 💭</span>
      </div>

      <!-- Emoji Quick Toolbar -->
      <div class="px-3 py-1.5 bg-sky-50/70 border-t border-sky-100 flex items-center justify-between">
        <div class="flex items-center gap-2 overflow-x-auto">
          <button onclick="insertEmoji('😊')" class="text-base hover:scale-125 transition">😊</button>
          <button onclick="insertEmoji('👋')" class="text-base hover:scale-125 transition">👋</button>
          <button onclick="insertEmoji('🌊')" class="text-base hover:scale-125 transition">🌊</button>
          <button onclick="insertEmoji('🏙️')" class="text-base hover:scale-125 transition">🏙️</button>
          <button onclick="insertEmoji('👍')" class="text-base hover:scale-125 transition">👍</button>
          <button onclick="insertEmoji('❤️')" class="text-base hover:scale-125 transition">❤️</button>
          <button onclick="insertEmoji('🏖️')" class="text-base hover:scale-125 transition">🏖️</button>
          <button onclick="insertEmoji('🍜')" class="text-base hover:scale-125 transition">🍜</button>
          <button onclick="insertEmoji('✨')" class="text-base hover:scale-125 transition">✨</button>
          <button onclick="insertEmoji('🎉')" class="text-base hover:scale-125 transition">🎉</button>
        </div>
        <button onclick="toggleEmojiDrawer()" class="text-xs text-sky-700 font-bold hover:bg-sky-100 px-2 py-1 rounded-lg transition flex items-center gap-1 shrink-0">
          <i class="fa-regular fa-face-smile"></i> 더보기
        </button>
      </div>

      <!-- Expandable Emoji Drawer -->
      <div id="emoji-drawer" class="hidden p-3 bg-white border-t border-sky-100 grid grid-cols-8 gap-2 max-h-36 overflow-y-auto">
        <!-- Populated via JS -->
      </div>

      <!-- Text Input Controls -->
      <div class="p-3 bg-white border-t border-sky-100 flex items-center gap-2">
        <input 
          type="text" 
          id="user-input" 
          placeholder="제민이에게 메시지를 보내보세요..." 
          class="flex-1 bg-slate-100 border border-slate-200 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-sky-400 focus:bg-white transition"
          onkeydown="handleKeyDown(event)"
        />
        <button 
          onclick="sendMessage()" 
          id="send-btn"
          class="bg-gradient-to-r from-sky-500 to-teal-400 hover:from-sky-600 hover:to-teal-500 text-white font-jua text-base px-5 py-2.5 rounded-xl shadow-md transition transform active:scale-95 flex items-center gap-1 shrink-0"
        >
          <span>전송</span>
          <i class="fa-solid fa-paper-plane text-xs"></i>
        </button>
      </div>

    </section>
  </main>

  <!-- Modal: Custom Alert / Reset Confirmation -->
  <div id="custom-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-2xl max-w-sm w-full p-5 shadow-2xl border border-slate-100 text-center">
      <div id="modal-icon" class="text-4xl mb-2">💡</div>
      <h3 id="modal-title" class="font-jua text-xl text-slate-800 mb-2">알림</h3>
      <p id="modal-message" class="text-xs text-slate-600 mb-5">내용 메시지</p>
      <div id="modal-buttons" class="flex justify-center gap-2">
        <!-- Dynamic buttons -->
      </div>
    </div>
  </div>

  <!-- JavaScript Logics -->
  <script>
    // State Variables
    let chatHistory = [];
    let isProcessing = false;
    let latestScoreData = null; // 최신 점수 기록 저장

    // Full Emoji list for drawer
    const emojiList = [
      '😊', '😄', '😍', '🥰', '🥳', '😎', '🤗', '👍', 
      '❤️', '✨', '🎉', '🌊', '🏙️', '🏖️', '🌉', '🐟', 
      '🍜', '🍱', '🚌', '🏞️', '🏰', '🎒', '🌸', '🍕',
      '💬', '⭐', '🎈', '🐬', '⛵', '🗺️', '📸', '👏'
    ];

    // Helper: Current Time String
    function getCurrentTime() {
      const now = new Date();
      return now.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
    }

    // Toggle Sound
    function toggleSound() {
      soundEnabled = !soundEnabled;
      const btn = document.getElementById('sound-btn');
      if (soundEnabled) {
        btn.innerHTML = '<i class="fa-solid fa-volume-high"></i>';
        btn.className = 'bg-sky-600/60 hover:bg-sky-600 text-white font-bold text-xs p-2 rounded-xl shadow transition active:scale-95';
      } else {
        btn.innerHTML = '<i class="fa-solid fa-volume-xmark"></i>';
        btn.className = 'bg-rose-500/80 hover:bg-rose-600 text-white font-bold text-xs p-2 rounded-xl shadow transition active:scale-95';
      }
    }

    // Web Audio Synthesizer Sound Effects
    function playSound(type) {
      if (!soundEnabled) return;
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);

        if (type === 'send') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(523.25, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(783.99, ctx.currentTime + 0.15);
          gain.gain.setValueAtTime(0.15, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.15);
          osc.start();
          osc.stop(ctx.currentTime + 0.15);
        } else if (type === 'receive') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(659.25, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.2);
          gain.gain.setValueAtTime(0.2, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.2);
          osc.start();
          osc.stop(ctx.currentTime + 0.2);
        }
      } catch (e) {
        console.log('Audio error:', e);
      }
    }

    // Insert Emoji into Input
    function insertEmoji(emoji) {
      const input = document.getElementById('user-input');
      input.value += emoji;
      input.focus();
    }

    // Toggle Emoji Drawer
    function toggleEmojiDrawer() {
      const drawer = document.getElementById('emoji-drawer');
      drawer.classList.toggle('hidden');
    }

    // Render Emoji Drawer Content
    function renderEmojiDrawer() {
      const drawer = document.getElementById('emoji-drawer');
      drawer.innerHTML = emojiList.map(e => `
        <button onclick="insertEmoji('${e}')" class="text-xl p-1.5 hover:bg-sky-100 rounded-lg transition transform hover:scale-125">
          ${e}
        </button>
      `).join('');
    }

    // Handle Keyboard Input
    function handleKeyDown(event) {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    }

    // Main Send Message Function
    async function sendMessage() {
      if (isProcessing) return;

      const input = document.getElementById('user-input');
      const text = input.value.trim();

      if (!text) return;

      input.value = '';

      const userMessage = {
        sender: 'user',
        text: text,
        timestamp: getCurrentTime()
      };
      chatHistory.push(userMessage);

      renderMessages();

      isProcessing = true;
      document.getElementById('send-btn').disabled = true;
      document.getElementById('typing-indicator').classList.remove('hidden');
      scrollToBottom();

      try {
        const jeminResponseText = await fetchGeminiResponse(chatHistory);

        const jeminMessage = {
          sender: 'jemin',
          text: jeminResponseText,
          timestamp: getCurrentTime()
        };
        chatHistory.push(jeminMessage);
        renderMessages();
      } catch (err) {
        console.error('Error fetching reply:', err);
        const errorMessage = {
          sender: 'jemin',
          text: '어라, 연결이 잠시 불안정해! 다시 한번 말해줄래? 😅',
          timestamp: getCurrentTime()
        };
        chatHistory.push(errorMessage);
        renderMessages();
      } finally {
        isProcessing = false;
        document.getElementById('send-btn').disabled = false;
        document.getElementById('typing-indicator').classList.add('hidden');
        scrollToBottom();
      }
    }

    // Initial load setup
    window.onload = function() {
      renderEmojiDrawer();
      const welcomeMsg = {
        sender: 'jemin',
        text: '안녕! 나는 부산에 사는 4학년 제민이야.\n우리 대화를 시작하기 전에 먼저 자기소개를 해줄래? 너의 이름과 살고 있는 고장을 말해줘.',
        timestamp: getCurrentTime()
      };
      chatHistory.push(welcomeMsg);
      renderMessages();
    };

    // Gemini API Request Function with strict Netiquette feedback rule
    async function fetchGeminiResponse(history) {
      const apiKey = ""; // Canvas runtime supplies this API key automatically if empty
      const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

      const systemPrompt = `너는 대한민국 부산 광역시에 사는 초등학교 4학년 학생 '제민'이야.
네 대화 상대는 다른 지역에 사는 또래 4학년 학생이야.
채팅의 가장 주요 목적은 학생의 **온라인 대화 예절(네티켓)을 바로 지도하는 것**이야!

★ [제민이의 대화 방식: 첫 대화 자기소개 유도 + 즉시 예절 피드백 + 2~3문장 짧고 가독성 좋은 답변] ★

1. 대화 시작 시 학생에게 먼저 반갑게 인사하며 **자기소개(이름, 사는 고장)**를 하도록 유도해 줘.
2. **[제민이 이모티콘 사용 규칙]**: 이모티콘은 특별히 꼭 필요한 상황이 아니라면 웬만하면 사용하지 말고, 깔끔하고 바른 문장으로 답변해 줘.
3. 학생이 대화 중 아래 항목을 어기면 **즉시 다정하게 1문장으로 바로 피드백 교정**을 해주고, 뒤이어 고장 소개 및 자기소개 대화를 1문장 이어줘. (전체 2~3문장 이내)

[피드백 및 지도 대상 항목]
1. **'ㅋㅋㅋ' 남발, 자음만 전송 ('ㅎㅎ', 'ㅇㅇ' 등)**:
   👉 "자음만 쓰거나 'ㅋㅋㅋ'를 많이 쓰면 뜻을 알기 어려우니 완전한 문장으로 써줘."
2. **이모티콘만 전송한 경우**:
   👉 "이모티콘만 보내면 무슨 뜻인지 정확히 알기 어려우니 글과 함께 써줘."
3. **단어 하나만 전송하거나, 3번 이상 단어로만 짧게 대답하는 경우**:
   👉 "단어 하나만 보내기보다는 하고 싶은 말을 완전한 문장으로 만들어서 적어줘."
4. **맞춤법이나 띄어쓰기가 2개 이상 틀린 경우**:
   👉 "맞춤법이나 띄어쓰기가 여러 개 틀리면 읽기 힘들어서 올바르게 적어주면 좋겠어."
5. **신조어 및 지나친 인터넷 줄임말 사용 ('억까', '킹받네', '알잘딱깔센', '어쩔티비' 등)**:
   👉 "신조어나 줄임말 대신 모두가 쉽게 이해할 수 있는 바른 우리말을 사용해 줘."
6. **대화 주제(지역 소개 및 자기소개)와 벗어난 딴소리**:
   👉 "우리는 지금 자기소개와 고장을 소개하는 중이야! 네 이야기를 들려줘."
7. **비속어, 나쁜 말, 무례한 언어**:
   👉 "상대방을 존중하는 고운 말을 써야 서로 즐겁게 대화할 수 있어."

* 학생이 예절을 잘 지켜서 자기소개를 하거나 질문하면 반갑게 칭찬하고 부산(해운대, 광안대교, 돼지국밥, 어묵 등)을 소개하거나 상대 지역에 대해 물어봐 줘!`;

      const formattedContents = history.map(msg => ({
        role: msg.sender === 'user' ? 'user' : 'model',
        parts: [{ text: msg.text }]
      }));

      const payload = {
        contents: formattedContents,
        systemInstruction: {
          parts: [{ text: systemPrompt }]
        }
      };

      let retries = 3;
      let delay = 1000;
      for (let i = 0; i < retries; i++) {
        try {
          const response = await fetch(apiUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          if (!response.ok) throw new Error(`HTTP error ${response.status}`);
          const data = await response.json();
          const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
          if (text) return text;
        } catch (err) {
          if (i === retries - 1) throw err;
          await new Promise(res => setTimeout(res, delay));
          delay *= 2;
        }
      }
      return "미안해! 제민이가 잠시 생각 중이었어. 완전한 문장과 고운 말로 다시 말해줄래? 😅";
    }

    // Render Chat Messages
    function renderMessages() {
      const container = document.getElementById('chat-messages');
      container.innerHTML = chatHistory.map((msg) => {
        if (msg.sender === 'user') {
          return `
            <div class="flex justify-end items-end space-x-2">
              <span class="text-[10px] text-slate-400 pb-1">${msg.timestamp}</span>
              <div class="bg-gradient-to-r from-sky-500 to-teal-500 text-white p-3 rounded-2xl rounded-br-none shadow-md max-w-[80%] break-words text-sm leading-relaxed">
                ${escapeHtml(msg.text)}
              </div>
            </div>
          `;
        } else {
          const hasFeedbackKeywords = msg.text.includes('문장') || msg.text.includes('맞춤법') || msg.text.includes('자음') || msg.text.includes('주제') || msg.text.includes('고운 말') || msg.text.includes('줄임말') || msg.text.includes('단어');

          return `
            <div class="flex items-start space-x-2.5">
              <div class="w-9 h-9 bg-amber-100 border-2 border-amber-300 rounded-full flex items-center justify-center text-xl shadow-sm shrink-0 mt-0.5">
                👦🏻
              </div>
              <div class="flex flex-col space-y-1 max-w-[82%]">
                <div class="flex items-center gap-1.5">
                  <span class="text-[11px] font-bold text-slate-600">제민이</span>
                  <span class="bg-sky-100 text-sky-700 font-semibold px-1.5 py-0.2 rounded text-[10px]">부산 4학년</span>
                  ${hasFeedbackKeywords ? '<span class="bg-amber-500 text-white font-bold px-1.5 py-0.2 rounded text-[10px] shadow-2xs">🚨 네티켓 지도</span>' : ''}
                </div>
                <div class="bg-white text-slate-800 p-3.5 rounded-2xl rounded-tl-none shadow-md border ${hasFeedbackKeywords ? 'border-amber-300 ring-2 ring-amber-100' : 'border-sky-100'} text-sm leading-relaxed whitespace-pre-line relative group">
                  ${escapeHtml(msg.text)}
                </div>
                <span class="text-[10px] text-slate-400 self-start pl-1">${msg.timestamp}</span>
              </div>
            </div>
          `;
        }
      }).join('');

      scrollToBottom();
    }

    function scrollToBottom() {
      const container = document.getElementById('chat-messages');
      container.scrollTop = container.scrollHeight;
    }

    // Helper functions for safe HTML string rendering
    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    // Download Chat History Transcript
    function downloadChatHistory() {
      if (chatHistory.length === 0) return;
      let transcript = "=========================================\n";
      transcript += " 초등 4학년 온라인 대화 예절 & 지역 소개 대화록\n";
      transcript += " 대화 상대: 부산 친구 제민이 & 학생\n";
      if (latestScoreData) {
        transcript += ` [네티켓 점수]: ${latestScoreData.score} / 10점 (${latestScoreData.badge})\n`;
        transcript += ` [칭찬할 점]: ${latestScoreData.praise}\n`;
        transcript += ` [아쉬운 점]: ${latestScoreData.improvement}\n`;
      }
      transcript += "=========================================\n\n";

      chatHistory.forEach(msg => {
        const sender = msg.sender === 'user' ? '나(학생)' : '제민이(부산)';
        transcript += `[${msg.timestamp}] ${sender}:\n${msg.text}\n\n`;
      });

      const blob = new Blob([transcript], { type: 'text/plain;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `네티켓_대화록_${new Date().toISOString().slice(0,10)}.txt`;
      a.click();
      URL.revokeObjectURL(a.href);
    }

    // AI Etiquette Score Evaluation Function
    async function evaluateEtiquetteScore() {
      const userMessages = chatHistory.filter(m => m.sender === 'user');
      if (userMessages.length < 2) {
        showModal('점수 측정 안내', '제민이와 대화를 조금 더 주고받은 후에 점수를 확인해 보세요! 😊', '확인');
        return;
      }

      showModal('대화 예절 평가 중', '제민이와 나눈 대화를 살펴보고 점수를 매기고 있어요... ⏳', null);

      const apiKey = "";
      const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

      const evalPrompt = `너는 초등학교 4학년 대상 온라인 예절(네티켓) 평가 선생님이야.
다음 대화에서 학생('user')이 보여준 대화 예절을 10점 만점 기준으로 객관적이고 따뜻하게 평가해줘.

[평가 기준]
1. 존중하는 고운 말과 어조 사용 여부
2. 완전한 문장으로 작성했는지 (단어 하나만 전송, 자음 'ㅋㅋㅋ'만 전송 유무)
3. 맞춤법 및 띄어쓰기 노력
4. 신조어/줄임말/비속어 사용 여부
5. 대화 주제(고장 소개 및 자기소개)에 잘 집중했는지

[대화 내용]
${JSON.stringify(chatHistory)}

응답은 반드시 아래 JSON 형식으로 작성해줘:
{
  "score": 9,
  "badge": "네티켓 지킴이",
  "praise": "칭찬할 점 (1~2문장)",
  "improvement": "보완하면 좋을 점 (1~2문장)",
  "comment": "제민이의 한마디 (1문장)"
}`;

      const payload = {
        contents: [{ role: 'user', parts: [{ text: evalPrompt }] }],
        generationConfig: { responseMimeType: "application/json" }
      };

      try {
        const response = await fetch(apiUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await response.json();
        const jsonText = data.candidates?.[0]?.content?.parts?.[0]?.text;
        const scoreResult = JSON.parse(jsonText);
        latestScoreData = scoreResult;

        showScoreModal(scoreResult);
      } catch (err) {
        console.error('Score eval error:', err);
        showModal('평가 오류', '점수를 계산하는 중에 잠시 오류가 발생했어요. 다시 시도해 주세요.', '확인');
      }
    }

    // Modal to Render Score Report
    function showScoreModal(data) {
      const modal = document.getElementById('custom-modal');
      document.getElementById('modal-title').innerText = '🏆 대화 예절 성적표';
      
      const contentHtml = `
        <div class="space-y-3 text-left my-2">
          <div class="bg-amber-50 border border-amber-200 rounded-xl p-3 text-center">
            <span class="text-xs text-amber-800 font-bold block mb-1">나의 네티켓 점수</span>
            <div class="font-jua text-3xl text-amber-600 flex items-center justify-center gap-1">
              ⭐ <span>${data.score}</span> <span class="text-base text-slate-400">/ 10점</span>
            </div>
            <span class="inline-block mt-1 bg-amber-400 text-amber-950 text-[11px] font-bold px-2 py-0.5 rounded-full">${data.badge}</span>
          </div>

          <div class="bg-slate-50 p-2.5 rounded-xl text-xs space-y-2 border border-slate-100">
            <div>
              <span class="font-bold text-emerald-600 block">👏 잘한 점:</span>
              <p class="text-slate-700 leading-relaxed">${escapeHtml(data.praise)}</p>
            </div>
            <div>
              <span class="font-bold text-sky-600 block">💡 더 발전할 점:</span>
              <p class="text-slate-700 leading-relaxed">${escapeHtml(data.improvement)}</p>
            </div>
          </div>

          <div class="bg-sky-50 p-2 rounded-xl text-xs text-sky-800 font-medium text-center border border-sky-100">
            👦🏻 제민이: "${escapeHtml(data.comment)}"
          </div>
        </div>
      `;

      document.getElementById('modal-message').innerHTML = contentHtml;
      
      const btnContainer = document.getElementById('modal-buttons');
      btnContainer.innerHTML = `
        <button onclick="document.getElementById('custom-modal').classList.add('hidden')" class="w-full py-2 bg-gradient-to-r from-sky-500 to-teal-400 text-white font-jua text-sm rounded-xl shadow transition active:scale-95">
          확인
        </button>
      `;

      modal.classList.remove('hidden');
    }

    // Reset Chat Dialog
    function confirmReset() {
      showModal(
        '대화 다시 시작',
        '지금까지 나눈 대화를 지우고 제민이와 다시 처음부터 시작할까요?',
        '다시 시작',
        '취소',
        () => {
          chatHistory = [{
            sender: 'jemin',
            text: '안녕! 나는 부산에 사는 4학년 제민이야.\n우리 대화를 시작하기 전에 먼저 자기소개를 해줄래? 너의 이름과 살고 있는 고장을 말해줘.',
            timestamp: getCurrentTime()
          }];
          renderMessages();
        }
      );
    }

    // Custom Modal System
    function showModal(title, message, confirmBtnText, cancelBtnText = null, onConfirm = null) {
      const modal = document.getElementById('custom-modal');
      document.getElementById('modal-title').innerText = title;
      document.getElementById('modal-message').innerText = message;
      
      const btnContainer = document.getElementById('modal-buttons');
      btnContainer.innerHTML = '';

      if (cancelBtnText) {
        const cancelBtn = document.createElement('button');
        cancelBtn.className = 'px-4 py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold text-xs rounded-xl transition';
        cancelBtn.innerText = cancelBtnText;
        cancelBtn.onclick = () => modal.classList.add('hidden');
        btnContainer.appendChild(cancelBtn);
      }

      const confirmBtn = document.createElement('button');
      confirmBtn.className = 'px-4 py-2 bg-sky-500 hover:bg-sky-600 text-white font-bold text-xs rounded-xl shadow transition';
      confirmBtn.innerText = confirmBtnText;
      confirmBtn.onclick = () => {
        modal.classList.add('hidden');
        if (onConfirm) onConfirm();
      };
      btnContainer.appendChild(confirmBtn);

      modal.classList.remove('hidden');
    }
  </script>
</body>
</html>
